name: Deployment smoke test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Full preview or production URL to verify
        required: true
        type: string

concurrency:
  group: deployment-smoke-${{ github.event.deployment.id || inputs.deployment_url }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.deployment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed routes
        run: npm run smoke
