name: Deployment health checks

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Full preview or production URL to verify
        required: true
        type: string

concurrency:
  group: deployment-smoke-${{ github.event.deployment.id || inputs.deployment_url }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Deployed pages, media API & security headers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.deployment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify homepage, search, media API and security headers
        run: npm run smoke
