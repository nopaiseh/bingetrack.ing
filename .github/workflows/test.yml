name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, unit, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild application schema
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --port 54322 --username postgres
          --dbname postgres --set ON_ERROR_STOP=1
          --file supabase/scripts/current_schema.sql

      - name: Configure local Supabase environment
        run: |
          source <(supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "${GITHUB_ENV}"

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

      - name: Run unit and component tests
        run: npm test

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run database tests
        run: supabase test db
