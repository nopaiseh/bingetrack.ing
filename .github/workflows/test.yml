name: Application quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, build, unit, browser & database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check code quality (ESLint)
        run: npm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Test units and components (Vitest)
        run: npm test

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0

      # supabase start 会按顺序应用 supabase/migrations/，同时验证迁移可从零重建。
      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Load deterministic browser-test data
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --port 54322 --username postgres
          --dbname postgres --set ON_ERROR_STOP=1
          --file supabase/fixtures/e2e_seed.sql

      - name: Configure local Supabase environment
        run: |
          source <(supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "${GITHUB_ENV}"

      - name: Validate application environment
        run: npm run env:check

      - name: Verify production build (Next.js)
        run: npm run build

      - name: Test browser flows (Playwright)
        run: npm run test:e2e

      - name: Test database behavior (pgTAP)
        run: supabase test db

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
